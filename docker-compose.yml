services:
  db:
    build:
      context: ./docker/postgres
    env_file:
      - ./api/.env
    ports:
      - "5424:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$DB_USER -d $$DB_NAME"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./api
    env_file:
      - ./api/.env
    environment:
      DB_HOST: db
      DB_PORT: "5432"
    command: >
      sh -c "python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8000"
    ports:
      - "8024:8000"
    volumes:
      - ./api/media:/app/media
    depends_on:
      db:
        condition: service_healthy

  front:
    build:
      context: ./front
      secrets:
        - front_env
    env_file:
      - ./front/.env
    ports:
      - "3024:3000"
    depends_on:
      - api

volumes:
  postgres_data:

secrets:
  front_env:
    file: ./front/.env
